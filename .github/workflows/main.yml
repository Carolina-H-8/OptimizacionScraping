name: Pruebas

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ejecutar-scraping:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v3

      - name: Configurar entorno de python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerias requeridas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de web scraping
        run: python argumedo_kevin_hernandez_astrid_analizando_eal1.py

            

          
          

          
        
    
    
